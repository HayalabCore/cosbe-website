# Firebase App Hosting configuration, shared by every backend.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets (database URLs, service keys) live in Google Secret Manager and are
# declared per environment in apphosting.<environment>.yaml, which a backend
# reads when its environment name matches (set in the console under
# Settings > Environment name). Create or refresh them from env/<env>.env with
# `yarn secrets:push:staging` (see env/README.md).
#
# Public NEXT_PUBLIC_* values and the rest are still set in the Firebase console
# (App Hosting > backend > Settings). They are needed at build time as well as
# runtime, since Next.js inlines NEXT_PUBLIC_* during `next build` and the build
# prerenders pages and the sitemap from the database.
#
# A backend without an environment name reads only this file.

runConfig:
  # Scale to zero when idle so an unvisited site costs nothing. The trade-off is
  # a ~1-3s cold start on the first request; set minInstances: 1 to remove it
  # (that instance runs 24/7 and is billed, roughly $5-10/month).
  minInstances: 0
  # Cost guard: caps how many containers can run at once. 3 x 80 concurrent
  # requests is far more than this site needs; raise it if real traffic saturates it.
  maxInstances: 3
  concurrency: 80
  cpu: 1
  # Next.js 16 SSR plus the Prisma client needs more than the 512 MiB default.
  memoryMiB: 1024
