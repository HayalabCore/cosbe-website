name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    env:
      # Prisma's client is constructed at module import time (pulled in via the
      # legacy-import pipeline). These tests never hit the database, but the
      # client still needs the datasource env vars to instantiate. Dummy values
      # are sufficient — no connection is ever opened.
      DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:password@localhost:5432/db?schema=public
      # MediaGalleryModal constructs a browser client on mount. Dummy values
      # are enough — tests mock storage/actions and never open a session.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosbe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # `yarn install` runs the postinstall hook (`prisma generate`), which
      # produces the @prisma/client types the build and tests rely on.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Test (db slice)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosbe_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cosbe_test?schema=public
          ADMIN_TEST_DB: '1'
        run: yarn prisma migrate deploy && yarn test:db
